
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOW Finds</title>
<style>
:root {
 --bg:#101010;
 --card:#1b1b1b;
 --orange:#ff7900;
 --white:#fff;
 --muted:#999;
 --line:#303030;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.container{width:min(1250px,94%);margin:auto}
header{background:#111;border-bottom:1px solid var(--line)}
nav{height:75px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:27px;font-weight:900;letter-spacing:-1px}
.logo span{color:var(--orange)}
.btn{padding:11px 18px;border:0;border-radius:8px;font-weight:bold}
.orange{background:var(--orange);color:#111}
.hero{text-align:center;padding:65px 15px 45px}
.hero h1{font-size:clamp(38px,6vw,65px);margin:0 0 12px}
.hero h1 span{color:var(--orange)}
.hero p{color:var(--muted);margin:0}
.products{padding:25px 0 75px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.product{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden;transition:.2s}
.product:hover{transform:translateY(-5px);border-color:var(--orange)}
.product-image{width:100%;aspect-ratio:1/1;background:#242424;display:block;object-fit:cover}
.product-content{padding:15px}
.product h3{font-size:16px;margin:0 0 13px;min-height:38px}
.product a{display:block;text-align:center;background:var(--orange);color:#111;text-decoration:none;padding:11px;border-radius:7px;font-size:13px;font-weight:800}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:70px 15px;border:1px dashed var(--line);border-radius:12px}
footer{border-top:1px solid var(--line);text-align:center;color:var(--muted);padding:25px;font-size:12px}
.modal-bg{display:none;position:fixed;inset:0;background:#000d;z-index:10;align-items:center;justify-content:center;padding:15px}
.modal-bg.open{display:flex}
.modal{width:min(550px,100%);max-height:90vh;overflow:auto;background:#1b1b1b;border:1px solid var(--line);border-radius:13px;padding:22px}
.modal-head{display:flex;align-items:center;justify-content:space-between}
.modal-head h2{margin:0}
.close{background:none;border:0;color:white;font-size:28px}
.field{display:flex;flex-direction:column;gap:8px;margin:15px 0}
.field label{color:var(--muted);font-size:13px}
.field input{width:100%;padding:13px;background:#101010;color:white;border:1px solid var(--line);border-radius:7px}
.admin-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#111;padding:12px;margin-top:9px;border-radius:7px}
.admin-item span{font-size:14px}
.admin-item button{border:0;padding:8px;border-radius:6px}
.edit{background:#333;color:white}
.delete{background:#922;color:white}
@media(max-width:950px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.product-content{padding:11px}.product h3{font-size:14px}.hero{padding:50px 10px 30px}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
 <div class="container">
  <nav>
   <div class="logo">WOW<span>FINDS</span></div>
   <button class="btn orange" onclick="openAdmin()">Admin</button>
  </nav>
 </div>
</header>

<main>
 <section class="hero">
  <h1>Discover <span>WOW</span> Finds</h1>
  <p>Interesting products worth discovering.</p>
 </section>

 <section class="products">
  <div class="container">
   <div class="grid" id="productGrid"></div>
  </div>
 </section>
</main>

<footer>© 2026 WOW Finds</footer>

<div class="modal-bg" id="adminModal">
 <div class="modal">
  <div class="modal-head">
   <h2>Admin Panel</h2>
   <button class="close" onclick="closeAdmin()">×</button>
  </div>

  <form id="productForm" onsubmit="saveProduct(event)">
   <input type="hidden" id="editId">

   <div class="field">
    <label>Product name</label>
    <input id="name" required placeholder="Product name">
   </div>

   <div class="field">
    <label>Photo URL</label>
    <input id="photo" type="url" required placeholder="https://...">
   </div>

   <div class="field">
    <label>Affiliate link</label>
    <input id="link" type="url" required placeholder="https://...">
   </div>

   <button class="btn orange" type="submit" id="saveButton">Add product</button>
   <button class="btn" type="button" onclick="resetForm()" style="background:#333;color:white">Clear</button>
  </form>

  <hr style="border:0;border-top:1px solid #333;margin:23px 0">
  <h3>Products</h3>
  <div id="adminList"></div>
 </div>
</div>

<script>
const KEY="wowfinds_simple_catalog";
let products=[];

try{
 const saved=localStorage.getItem(KEY);
 products=saved?JSON.parse(saved):[];
 if(!Array.isArray(products))products=[];
}catch(e){products=[]}

function persist(){
 localStorage.setItem(KEY,JSON.stringify(products));
}

function safe(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function safeUrl(value){
 try{
  const u=new URL(value);
  return ["http:","https:"].includes(u.protocol)?u.href:"";
 }catch(e){return ""}
}

function render(){
 const grid=document.getElementById("productGrid");

 if(!products.length){
  grid.innerHTML='<div class="empty">No products yet.<br>Open Admin to add your first product.</div>';
  return;
 }

 grid.innerHTML=products.map(p=>{
  const photo=safeUrl(p.photo);
  const link=safeUrl(p.link);

  return `
   <article class="product">
    <img class="product-image" src="${safe(photo)}" alt="${safe(p.name)}">
    <div class="product-content">
     <h3>${safe(p.name)}</h3>
     ${link?`<a href="${safe(link)}" target="_blank" rel="noopener noreferrer">DISCOVER PRODUCT ↗</a>`:""}
    </div>
   </article>
  `;
 }).join("");
}

function openAdmin(){
 document.getElementById("adminModal").classList.add("open");
 renderAdmin();
}

function closeAdmin(){
 document.getElementById("adminModal").classList.remove("open");
}

function resetForm(){
 document.getElementById("productForm").reset();
 document.getElementById("editId").value="";
 document.getElementById("saveButton").textContent="Add product";
}

function saveProduct(event){
 event.preventDefault();

 const id=document.getElementById("editId").value;
 const product={
  id:id?Number(id):Date.now(),
  name:document.getElementById("name").value.trim(),
  photo:document.getElementById("photo").value.trim(),
  link:document.getElementById("link").value.trim()
 };

 if(!safeUrl(product.photo)||!safeUrl(product.link)){
  alert("Please enter valid photo and affiliate links.");
  return;
 }

 if(id){
  products=products.map(p=>p.id===Number(id)?product:p);
 }else{
  products.unshift(product);
 }

 persist();
 resetForm();
 render();
 renderAdmin();
}

function renderAdmin(){
 const list=document.getElementById("adminList");

 if(!products.length){
  list.innerHTML='<p style="color:#999">No products added yet.</p>';
  return;
 }

 list.innerHTML=products.map(p=>`
  <div class="admin-item">
   <span>${safe(p.name)}</span>
   <div style="display:flex;gap:6px">
    <button class="edit" onclick="editProduct(${p.id})">Edit</button>
    <button class="delete" onclick="deleteProduct(${p.id})">Delete</button>
   </div>
  </div>
 `).join("");
}

function editProduct(id){
 const p=products.find(x=>x.id===id);
 if(!p)return;

 document.getElementById("editId").value=p.id;
 document.getElementById("name").value=p.name;
 document.getElementById("photo").value=p.photo;
 document.getElementById("link").value=p.link;
 document.getElementById("saveButton").textContent="Save changes";
 document.querySelector(".modal").scrollTo({top:0,behavior:"smooth"});
}

function deleteProduct(id){
 if(!confirm("Delete this product?"))return;
 products=products.filter(p=>p.id!==id);
 persist();
 render();
 renderAdmin();
 resetForm();
}

document.getElementById("adminModal").addEventListener("click",e=>{
 if(e.target.id==="adminModal")closeAdmin();
});

render();
</script>
</body>
</html>
