<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Топ товари</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.4;
      padding: 20px 16px 60px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
      padding-top: 10px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #ff6b00;
      margin-bottom: 6px;
    }

    .header p {
      color: #aaa;
      font-size: 15px;
    }

    .products {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      max-width: 480px;
      margin: 0 auto;
    }

    @media (min-width: 600px) {
      .products {
        grid-template-columns: 1fr 1fr;
        max-width: 700px;
      }
    }

    .card {
      background: #141414;
      border: 1px solid #222;
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #ff6b00;
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      background: #1a1a1a;
    }

    .card-body {
      padding: 16px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #fff;
    }

    .card-price {
      font-size: 20px;
      font-weight: 700;
      color: #ff6b00;
      margin-bottom: 14px;
    }

    .buttons {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      display: block;
      text-align: center;
      padding: 12px 8px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn-amazon {
      background: #ff6b00;
      color: #000;
    }

    .btn-ali {
      background: #1a1a1a;
      color: #ff6b00;
      border: 1px solid #ff6b00;
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      color: #555;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Топ товари</h1>
    <p>Перевірені позиції з Amazon та AliExpress</p>
  </div>

  <div class="products" id="products"></div>

  <div class="footer">
    Реферальні посилання · Зручна покупка
  </div>

  <script>
    // ============================================
    //  ТУТ ДОДАВАЙ І МІНЯЙ ТОВАРИ
    // ============================================
    const products = [
      {
        title: "Приклад товару 1",
        price: "1 299 ₴",
        image: "https://via.placeholder.com/400x400/1a1a1a/ff6b00?text=Товар+1",
        amazon: "https://www.amazon.com/dp/XXXXXXXX",
        ali: "https://www.aliexpress.com/item/XXXXXXXX.html"
      },
      {
        title: "Приклад товару 2",
        price: "899 ₴",
        image: "https://via.placeholder.com/400x400/1a1a1a/ff6b00?text=Товар+2",
        amazon: "https://www.amazon.com/dp/YYYYYYYY",
        ali: "https://www.aliexpress.com/item/YYYYYYYY.html"
      },
      {
        title: "Приклад товару 3",
        price: "2 150 ₴",
        image: "https://via.placeholder.com/400x400/1a1a1a/ff6b00?text=Товар+3",
        amazon: "https://www.amazon.com/dp/ZZZZZZZZ",
        ali: ""   // можна залишити порожнім — кнопка не з'явиться
      }
    ];

    // ============================================
    //  Код нижче краще не чіпати
    // ============================================
    const container = document.getElementById('products');

    products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';

      let buttonsHtml = '';
      if (p.amazon) {
        buttonsHtml += `<a href="${p.amazon}" target="_blank" rel="noopener" class="btn btn-amazon">Amazon</a>`;
      }
      if (p.ali) {
        buttonsHtml += `<a href="${p.ali}" target="_blank" rel="noopener" class="btn btn-ali">AliExpress</a>`;
      }

      card.innerHTML = `
        <img src="${p.image}" alt="${p.title}" loading="lazy">
        <div class="card-body">
          <div class="card-title">${p.title}</div>
          <div class="card-price">${p.price}</div>
          <div class="buttons">${buttonsHtml}</div>
        </div>
      `;

      container.appendChild(card);
    });
  </script>
</body>
</html>
