
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOW Finds</title>
<style>
:root {
  --bg:#101010;
  --panel:#1c1c1c;
  --orange:#ff7900;
  --white:#fff;
  --muted:#999;
  --line:#303030;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.container{width:min(1150px,92%);margin:auto}
header{border-bottom:1px solid var(--line);background:#111;position:sticky;top:0;z-index:5}
nav{height:75px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:26px;font-weight:900;letter-spacing:-1px}
.logo span{color:var(--orange)}
.btn{border:0;border-radius:9px;padding:12px 19px;font-weight:bold}
.orange{background:var(--orange);color:#111}
.dark{background:#292929;color:white;border:1px solid var(--line)}
.hero{text-align:center;padding:100px 15px 75px;background:radial-gradient(ellipse at center top,#42220c,transparent 65%)}
.hero small{color:var(--orange);letter-spacing:3px;font-weight:bold}
.hero h1{font-size:clamp(42px,7vw,76px);margin:20px 0;line-height:1.05}
.hero h1 span{color:var(--orange)}
.hero p{color:var(--muted);font-size:17px;max-width:570px;margin:0 auto;line-height:1.7}
.products-section{padding:45px 0 80px}
.section-title{font-size:30px;margin:0 0 8px}
.section-subtitle{color:var(--muted);margin:0 0 28px}
.product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.product{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.product img{width:100%;height:230px;object-fit:cover;background:#292929;display:block}
.product-content{padding:18px}
.product h3{margin:0 0 10px}
.product p{color:var(--muted);font-size:14px;line-height:1.5}
.price{color:var(--orange);font-size:20px;font-weight:bold}
.product-links{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.product-links a{padding:9px 12px;border-radius:7px;font-size:12px;font-weight:bold;text-decoration:none}
.amazon{background:#ff9900;color:#111}
.ali{background:#e53238;color:white}
.empty{border:1px dashed var(--line);border-radius:15px;padding:65px 20px;text-align:center;color:var(--muted);grid-column:1/-1}
footer{border-top:1px solid var(--line);padding:28px 0;text-align:center;color:var(--muted);font-size:13px}
.modal-bg{display:none;position:fixed;inset:0;background:#000c;z-index:10;align-items:center;justify-content:center;padding:15px}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:23px;width:min(600px,100%);max-height:90vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center}
.modal-head h2{margin:0}
.close{border:0;background:none;color:white;font-size:27px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:20px 0}
.field{display:flex;flex-direction:column;gap:7px}
.field.full{grid-column:1/-1}
.field label{font-size:13px;color:var(--muted)}
.field input,.field textarea{width:100%;padding:12px;background:#111;border:1px solid var(--line);border-radius:8px;color:white}
.field textarea{min-height:75px}
.admin-product{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:#111;border-radius:8px;margin-top:9px}
.admin-product button{border:0;border-radius:6px;padding:8px 10px}
.delete{background:#8e2525;color:white}
.edit{background:#333;color:white}
@media(max-width:750px){.product-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.product-grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.hero{padding:70px 10px}}
</style>
</head>
<body>

<header>
 <div class="container">
  <nav>
   <div class="logo">WOW<span>FINDS</span></div>
   <button class="btn orange" onclick="openAdmin()">Admin</button>
  </nav>
 </div>
</header>

<main>
 <section class="hero">
  <small>DISCOVER SOMETHING DIFFERENT</small>
  <h1>Find something<br><span>WOW.</span></h1>
  <p>Interesting products. Smart discoveries. Things worth checking out.</p>
 </section>

 <section class="products-section">
  <div class="container">
   <h2 class="section-title">Our Products</h2>
   <p class="section-subtitle">Discover our latest finds.</p>
   <div class="product-grid" id="productGrid"></div>
  </div>
 </section>
</main>

<footer>
 <div class="container">© 2026 WOW Finds. All rights reserved.</div>
</footer>

<div class="modal-bg" id="adminModal">
 <div class="modal">
  <div class="modal-head">
   <h2>Admin Panel</h2>
   <button class="close" onclick="closeAdmin()">×</button>
  </div>

  <form id="productForm" onsubmit="saveProduct(event)">
   <input type="hidden" id="editId">
   <div class="form">
    <div class="field full">
     <label>Product name *</label>
     <input id="name" required placeholder="Product name">
    </div>
    <div class="field">
     <label>Price</label>
     <input id="price" placeholder="$19.99">
    </div>
    <div class="field">
     <label>Category</label>
     <input id="category" placeholder="Gadgets, Home...">
    </div>
    <div class="field full">
     <label>Product image URL</label>
     <input id="image" type="url" placeholder="https://...">
    </div>
    <div class="field full">
     <label>Description</label>
     <textarea id="description" placeholder="Product description"></textarea>
    </div>
    <div class="field full">
     <label>Amazon affiliate link</label>
     <input id="amazon" type="url" placeholder="https://...">
    </div>
    <div class="field full">
     <label>AliExpress affiliate link</label>
     <input id="aliexpress" type="url" placeholder="https://...">
    </div>
   </div>
   <button class="btn orange" type="submit" id="saveButton">Add product</button>
   <button class="btn dark" type="button" onclick="resetForm()">Clear</button>
  </form>

  <hr style="border:0;border-top:1px solid var(--line);margin:22px 0">
  <h3>My products</h3>
  <div id="adminList"></div>
 </div>
</div>

<script>
const KEY="wowfinds_products_v3";
let products=[];

try {
 const saved=localStorage.getItem(KEY);
 products=saved?JSON.parse(saved):[];
 if(!Array.isArray(products))products=[];
} catch(e) {
 products=[];
}

function persist(){
 localStorage.setItem(KEY,JSON.stringify(products));
}

function safe(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function safeUrl(value){
 try{
  const u=new URL(value);
  return u.protocol==="https:"||u.protocol==="http:"?u.href:"";
 }catch(e){return "";}
}

function renderProducts(){
 const grid=document.getElementById("productGrid");

 if(products.length===0){
  grid.innerHTML='<div class="empty">No products yet.<br>Add your first product through the Admin panel.</div>';
  return;
 }

 grid.innerHTML=products.map(p=>{
  const image=safeUrl(p.image);
  const amazon=safeUrl(p.amazon);
  const ali=safeUrl(p.aliexpress);

  return `
   <article class="product">
    ${image?`<img src="${safe(image)}" alt="${safe(p.name)}">`:
    '<div style="height:180px;display:grid;place-items:center;font-size:55px;background:#292929">📦</div>'}
    <div class="product-content">
     <div style="color:var(--orange);font-size:12px">${safe(p.category)}</div>
     <h3>${safe(p.name)}</h3>
     <p>${safe(p.description)}</p>
     <div class="price">${safe(p.price)}</div>
     <div class="product-links">
      ${amazon?`<a class="amazon" href="${safe(amazon)}" target="_blank" rel="noopener noreferrer">Amazon ↗</a>`:""}
      ${ali?`<a class="ali" href="${safe(ali)}" target="_blank" rel="noopener noreferrer">AliExpress ↗</a>`:""}
     </div>
    </div>
   </article>
  `;
 }).join("");
}

function openAdmin(){
 document.getElementById("adminModal").classList.add("open");
 renderAdmin();
}

function closeAdmin(){
 document.getElementById("adminModal").classList.remove("open");
}

function resetForm(){
 document.getElementById("productForm").reset();
 document.getElementById("editId").value="";
 document.getElementById("saveButton").textContent="Add product";
}

function saveProduct(event){
 event.preventDefault();

 const id=document.getElementById("editId").value;
 const product={
  id:id?Number(id):Date.now(),
  name:document.getElementById("name").value.trim(),
  price:document.getElementById("price").value.trim(),
  category:document.getElementById("category").value.trim(),
  image:document.getElementById("image").value.trim(),
  description:document.getElementById("description").value.trim(),
  amazon:document.getElementById("amazon").value.trim(),
  aliexpress:document.getElementById("aliexpress").value.trim()
 };

 if(id){
  products=products.map(p=>p.id===Number(id)?product:p);
 }else{
  products.unshift(product);
 }

 persist();
 resetForm();
 renderProducts();
 renderAdmin();
}

function renderAdmin(){
 const list=document.getElementById("adminList");

 if(!products.length){
  list.innerHTML='<p style="color:var(--muted)">Your product list is empty.</p>';
  return;
 }

 list.innerHTML=products.map(p=>`
  <div class="admin-product">
   <span>${safe(p.name)}</span>
   <div style="display:flex;gap:6px">
    <button class="edit" onclick="editProduct(${p.id})">Edit</button>
    <button class="delete" onclick="deleteProduct(${p.id})">Delete</button>
   </div>
  </div>
 `).join("");
}

function editProduct(id){
 const p=products.find(x=>x.id===id);
 if(!p)return;

 document.getElementById("editId").value=p.id;
 document.getElementById("name").value=p.name;
 document.getElementById("price").value=p.price;
 document.getElementById("category").value=p.category;
 document.getElementById("image").value=p.image;
 document.getElementById("description").value=p.description;
 document.getElementById("amazon").value=p.amazon;
 document.getElementById("aliexpress").value=p.aliexpress;
 document.getElementById("saveButton").textContent="Save changes";
 document.querySelector(".modal").scrollTo({top:0,behavior:"smooth"});
}

function deleteProduct(id){
 if(!confirm("Delete this product?"))return;
 products=products.filter(p=>p.id!==id);
 persist();
 renderProducts();
 renderAdmin();
 resetForm();
}

document.getElementById("adminModal").addEventListener("click",e=>{
 if(e.target.id==="adminModal")closeAdmin();
});

renderProducts();
</script>
</body>
</html>
